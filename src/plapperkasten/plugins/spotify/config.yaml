---
plugins:
  spotify:
    # Enable after installing and pairing Spotify Soloist on this device.
    enabled: false
    executable: 'soloist'
    # Soloist must run with --ws 127.0.0.1:9090.
    endpoint: '127.0.0.1:9090'
    interval_poll: 2
    command_timeout: 3
    # Relative to core.paths.user_directory, or an absolute path.
    filename_favorites: 'spotify_favorites.yaml'
