# Keep Spotify at unity gain; Plapperkasten applies the shared output volume.
# Install as ~/.config/pipewire/client.conf.d/60-plapperkasten-spotify-volume.conf
stream.rules = [
  {
    matches = [ { node.name = "spotify" } ]
    actions = {
      update-props = {
        channelmix.lock-volumes = true
      }
    }
  }
]
